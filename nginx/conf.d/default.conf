server {
    listen 80;
    server_name _;

    # 【可选】启用 HTTPS 后，取消下一行注释，强制 HTTP 跳转 HTTPS（P2-8）：
    # return 301 https://$host$request_uri;

    # 禁止所有缓存（Lark webview 缓存极其顽固）
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 后端API代理
    location /api/ {
        proxy_pass http://backend:8088/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件访问
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
    }
}

# ═══════════════════════════════════════════════════════════════
# 【可选】HTTPS 配置（P2-8）—— 默认关闭，按需启用
# ═══════════════════════════════════════════════════════════════
# 现状：仅启用 80(HTTP)。若需启用 HTTPS：
#   1. 将证书放入 ./nginx/ssl/（server.crt 证书 + server.key 私钥；公司证书或 Let's Encrypt 均可）
#   2. 取消下方 server 块注释
#   3. 如需强制 HTTP 跳 HTTPS，同时取消上方 80 server 里 return 301 的注释
#   4. docker restart ams-nginx
# 提示：若 HTTPS 已由前置 LB/网关终结（浏览器访问 aap.hknhw.com 已是 https 带锁），
#       则无需启用本配置，保持现状即可。

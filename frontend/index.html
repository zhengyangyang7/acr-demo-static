      visible: false, item: null, abnormal_type: 'location_mismatch',
      abnormal_desc: '', loading: false,
    });

    function formatInventoryScope(type, value){
      if (type === 'all') return '全部资产';
      if (type === 'location') return '指定位置：' + (value || '-');
      return '仅库存资产';
    }

    function inventoryStatusLabel(st){
      if (st === 'ongoing' || st === '进行中') return '进行中';
      if (st === 'completed' || st === '已完成') return '已完成';
      return st || '-';
    }

    function inventoryCheckLabel(st){
      return ({ pending:'未盘', normal:'正常', abnormal:'异常', missing:'盘亏' })[st || 'pending'] || st || '未盘';
    }

    function inventoryCheckTagType(st){
      return ({ pending:'info', normal:'success', abnormal:'danger', missing:'warning' })[st || 'pending'] || 'info';
    }

    function inventoryItemInfo(item){
      if (!item) return {};
      if (item._infoParsed) return item._infoParsed;
      let info = {};
      try {
        info = typeof item.asset_info === 'string' ? JSON.parse(item.asset_info || '{}') : (item.asset_info || {});
      } catch(e) { info = {}; }
      item._infoParsed = info;
      return info;
    }

    async function loadInventories(){
      inventoryLoading.value=true;
      try{
        const r=await fetch(API+'/inventory/tasks',{headers:{'Authorization':'Bearer '+localStorage.getItem('ams_token')}});
        const d=await r.json();
        if(d.success)inventoryList.value=d.data||[];
      }catch(e){}
      finally{inventoryLoading.value=false}
    }

    function inventoryProgress(row){
      return row.total_count&&row.total_count>0?Math.round((row.checked_count||0)/row.total_count*100):0;
    }

    function openInventoryCreate(){
      inventoryCreateDialog.form = { task_name: '', scope_type: 'in_stock', scope_value: '', notes: '' };
      inventoryCreateDialog.visible = true;
    }

    async function createInventoryTask(){
      if (!inventoryCreateDialog.form.task_name.trim()) {
        ElementPlus.ElMessage.warning('请输入任务名称');
        return;
      }
      inventoryCreateDialog.loading = true;
      try {
        const r = await fetch(`${API}/inventory/tasks`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (localStorage.getItem('ams_token') || '')
          },
          body: JSON.stringify({
            ...inventoryCreateDialog.form,
            created_by: currentUser.name || currentUser.username || '管理员'
          })
        }).then(r => r.json());
        if (r.success) {
          ElementPlus.ElMessage.success('盘点任务创建成功');
          inventoryCreateDialog.visible = false;
          await loadInventories();
          loadStats();
          if (r.task) openInventoryWorkbench({ ...r.task, status: 'ongoing' });
        } else {
          ElementPlus.ElMessage.error(r.error || '创建失败');
        }
      } catch (e) {
        ElementPlus.ElMessage.error('网络错误，请稍后重试');
      } finally {
        inventoryCreateDialog.loading = false;
      }
    }

    async function openInventoryWorkbench(row){
      inventoryWorkbench.visible = true;
      inventoryWorkbench.task = row;
      inventoryWorkbench.filter = '';
      await loadInventoryItems();
    }

    function closeInventoryWorkbench(){
      inventoryWorkbench.visible = false;
      inventoryWorkbench.task = null;
      inventoryWorkbench.items = [];
      loadInventories();
    }

    async function loadInventoryItems(){
      if (!inventoryWorkbench.task) return;
      inventoryWorkbench.loading = true;
      try{
        let u = API+'/inventory/tasks/'+inventoryWorkbench.task.id+'/items';
        if (inventoryWorkbench.filter) u += '?check_status='+encodeURIComponent(inventoryWorkbench.filter);
        const r = await fetch(u,{headers:{'Authorization':'Bearer '+localStorage.getItem('ams_token')}});
        const d = await r.json();
        inventoryWorkbench.items = d.data || [];
        // 刷新任务进度
        const tr = await fetch(API+'/inventory/tasks/'+inventoryWorkbench.task.id,{headers:{'Authorization':'Bearer '+localStorage.getItem('ams_token')}});
        const td = await tr.json();
        if (td.success && td.task) inventoryWorkbench.task = td.task;
      }catch(e){
        ElementPlus.ElMessage.error('加载盘点明细失败');
      }finally{
        inventoryWorkbench.loading = false;
      }
    }

    async function checkInventoryItem(item){
      inventoryWorkbench.checkingId = item.id;
      try{
        const r = await fetch(API+'/inventory/items/'+item.id+'/check',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('ams_token')},
          body:JSON.stringify({
            check_method:'manual',
            checked_by: currentUser.name || currentUser.username || '管理员',
            notes:''
          })
        });
        const d = await r.json();
        if (!r.ok || !d.success){
          ElementPlus.ElMessage.error(d.error || '核对失败');
          return;
        }
        ElementPlus.ElMessage.success('已确认');
        await loadInventoryItems();
        loadStats();
      }catch(e){
        ElementPlus.ElMessage.error('核对失败');
      }finally{
        inventoryWorkbench.checkingId = null;
      }
    }

    function openInventoryAbnormal(item){
      inventoryAbnormalDlg.item = item;
      inventoryAbnormalDlg.abnormal_type = 'location_mismatch';
      inventoryAbnormalDlg.abnormal_desc = '';
      inventoryAbnormalDlg.visible = true;
    }

    async function submitInventoryAbnormal(){
      if (!inventoryAbnormalDlg.abnormal_desc.trim()){
        ElementPlus.ElMessage.warning('请填写异常描述');
        return;
      }
      inventoryAbnormalDlg.loading = true;
      try{
        const r = await fetch(API+'/inventory/items/'+inventoryAbnormalDlg.item.id+'/abnormal',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('ams_token')},
          body:JSON.stringify({
            abnormal_type: inventoryAbnormalDlg.abnormal_type,
            abnormal_desc: inventoryAbnormalDlg.abnormal_desc,
            checked_by: currentUser.name || currentUser.username || '管理员',
          })
        });
        const d = await r.json();
        if (!r.ok || !d.success){
          ElementPlus.ElMessage.error(d.error || '标记失败');
          return;
        }
        ElementPlus.ElMessage.success(d.check_status==='missing'?'已标记盘亏':'已标记异常');
        inventoryAbnormalDlg.visible = false;
        await loadInventoryItems();
        loadStats();
      }catch(e){
        ElementPlus.ElMessage.error('标记失败');
      }finally{
        inventoryAbnormalDlg.loading = false;
      }
    }

    async function completeInventoryTask(){
      if (!inventoryWorkbench.task) return;
      try{
        await ElementPlus.ElMessageBox.confirm('确认完成本次盘点？完成后不可继续核对。','完成盘点',{type:'warning'});
      }catch(e){ return; }
      inventoryWorkbench.completing = true;
      try{
        const r = await fetch(API+'/inventory/tasks/'+inventoryWorkbench.task.id+'/complete',{
          method:'POST',
          headers:{'Authorization':'Bearer '+localStorage.getItem('ams_token')}
        });
        const d = await r.json();
        if (!r.ok || !d.success){
          ElementPlus.ElMessage.error(d.error || '完成失败');
          return;
        }
        ElementPlus.ElMessage.success('盘点已完成');
        await loadInventoryItems();
        loadStats();
      }catch(e){
        ElementPlus.ElMessage.error('完成失败');
      }finally{
        inventoryWorkbench.completing = false;
      }
    }

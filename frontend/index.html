<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="./ams-role.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>企业资产管理系统</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./lib/element-plus.index.css">
<script src="./lib/vue.global.prod.js"></script>
<script src="./lib/element-plus.index.full.min.js"></script>
<script src="./lib/element-plus-zh-cn.min.js"></script>
<script src="./ams-ep-zh.js"></script>
<script src="./lib/echarts.min.js"></script>
<!-- Element Plus Icons -->
<script src="./lib/element-plus-icons.iife.min.js"></script>
<!-- Lark H5 SDK（仅在 Lark 环境中加载） -->
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; }

.app-layout { display: flex; min-height: 100vh; }

/* 侧边栏 */
.sidebar {
  width: 220px; height: 100vh; max-height: 100vh; background: #243038;
  display: flex; flex-direction: column; position: fixed; left: 0; top: 0; z-index: 100;
  box-shadow: 2px 0 12px rgba(0,0,0,0.15);
  transition: transform 0.3s ease;
  overflow: hidden;
}
/* 移动端侧边栏 */
.sidebar.collapsed { transform: translateX(-100%); }

/* 移动端侧边栏遮罩 */
.sidebar-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4); z-index: 90; display: none;
}
.sidebar-overlay.active { display: block; }

/* 汉堡按钮（移动端） */
.mobile-toggle {
  display: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 6px;
  margin-right: 12px; background: #f5f5f5; align-items: center; justify-content: center;
}
.mobile-toggle:hover { background: #e8e8e8; }

/* 主内容 */
.main-content { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; transition: margin-left 0.3s ease; }
.main-content.expanded { margin-left: 0; }
.sidebar-logo {
  padding: 20px 16px 16px; display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
.sidebar-logo .logo-icon { width: 36px; height: 36px; background: #1a6b5c; border-radius: 8px;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.sidebar-logo .logo-text { color:#fff; font-size:14px; font-weight:600; line-height:1.3;}
.sidebar-logo .logo-sub  { color:rgba(255,255,255,0.5); font-size:11px; }
.nav-menu { flex:1; min-height: 0; padding: 8px 0; overflow-y: auto; }
.nav-item, a.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 20px;
  color: rgba(255,255,255,0.65); cursor: pointer; font-size:13px;
  border-radius: 0; transition: all 0.2s; margin: 1px 8px; border-radius: 8px;
  font-family: inherit;
  text-decoration: none;
}
.nav-item:hover, a.nav-item:hover { color:#fff; background:rgba(255,255,255,0.08); }
.nav-item.active, a.nav-item.active { color:#fff; background: rgba(26,107,92,0.72); }
.nav-item .nav-icon { font-size: 16px; width:18px; text-align:center; }
.nav-group-title { padding: 12px 20px 4px; color:rgba(255,255,255,0.3); font-size:11px; letter-spacing:1px; text-transform:uppercase; }

/* 主内容 */
.main-content { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  height: 56px; background: #fff; display: flex; align-items: center;
  padding: 0 24px; border-bottom: 1px solid #e8e8e8;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06); position: sticky; top:0; z-index:50;
}
.topbar-title { font-size: 16px; font-weight: 600; color: #1a1f35; flex:1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display:flex;align-items:center;gap:12px; }

/* 用户头像下拉菜单 */
.user-avatar-dropdown { cursor: pointer; }
.user-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: #1a6b5c;
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
  box-shadow: 0 2px 8px rgba(26,107,92,0.28);
  transition: transform 0.2s;
}
.user-avatar:hover { transform: scale(1.05); }
.user-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

/* 下拉菜单用户卡片 */
.user-dropdown-header {
  padding: 16px 20px;
  border-bottom: 1px solid #f0f0f0;
  min-width: 220px;
}
.user-dropdown-header .user-info-row {
  display: flex; align-items: center; gap: 12px;
}
.user-dropdown-header .user-avatar-large {
  width: 48px; height: 48px; border-radius: 50%;
  background: #1a6b5c;
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 600; flex-shrink: 0;
}
.user-dropdown-header .user-avatar-large img {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
}
.user-dropdown-header .user-meta { flex: 1; min-width: 0; }
.user-dropdown-header .user-name {
  font-size: 15px; font-weight: 600; color: #1a1f35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-dropdown-header .user-role {
  font-size: 12px; color: #8c8c8c; margin-top: 2px;
}
.user-dropdown-header .user-source {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: #00b0f0; margin-top: 4px;
  padding: 2px 8px; background: rgba(0,176,240,0.1); border-radius: 4px;
}

.page-content { padding: 20px 24px; flex:1; }

/* 卡片 */
.stat-cards { display: grid; grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); gap: 16px; margin-bottom:20px; }
.stat-card {
  background: #fff; border-radius: 12px; padding: 18px 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: all 0.2s;
}
.stat-card:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(0,0,0,0.1); }
.stat-card .label { font-size:12px; color:#8c8c8c; margin-bottom:6px; }
.stat-card .value { font-size:28px; font-weight:700; }
.stat-card.blue .value   { color:#1a6b5c; }
.stat-card.green .value  { color:#52c41a; }
.stat-card.orange .value { color:#fa8c16; }
.stat-card.red .value    { color:#ff4d4f; }
.stat-card.gray .value   { color:#8c8c8c; }
.stat-card.purple .value { color:#722ed1; }

/* 表格容器 */
.table-card { background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); overflow-x: auto; overflow-y: visible; }
.table-wrapper { overflow-x: auto; }
.plain-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
.plain-table thead {
  background: #fafafa;
  border-bottom: 1px solid #f0f0f0;
}
.plain-table th {
  padding: 12px 10px;
  text-align: left;
  font-weight: 600;
  color: #333;
  white-space: nowrap;
  border-bottom: 1px solid #f0f0f0;
}
.plain-table tbody tr:nth-child(even) { background: #fafafa; }
.plain-table tbody tr:hover { background: #f5f7fa; }
.plain-table td {
  padding: 10px;
  border-bottom: 1px solid #f0f0f0;
  color: #333;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* 允许备注等长文本列换行 */
.plain-table td.wrap-cell { white-space: normal; word-break: break-word; }

/* 认证遮罩层 */
.auth-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #1a6b5c;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.auth-loading {
  text-align: center;
  color: #fff;
}
.auth-loading .el-icon {
  margin-bottom: 16px;
}
.auth-loading p {
  font-size: 14px;
  opacity: 0.9;
}
.auth-error {
  background: #fff;
  border-radius: 16px;
  padding: 48px;
  text-align: center;
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.auth-error .error-icon {
  font-size: 64px;
  margin-bottom: 16px;
}
.auth-error h3 {
  font-size: 20px;
  font-weight: 600;
  color: #1a1f35;
  margin: 0 0 12px;
}
.auth-error p {
  font-size: 14px;
  color: #8c8c8c;
  margin: 0 0 8px;
}
.auth-error .error-sub {
  margin-top: 24px;
}

/* 移动端卡片样式 */
.mobile-card-list {
  display: none;
  padding: 12px;
  gap: 12px;
}
.asset-card, .stock-card, .repair-card, .employee-card, .lark-card, .consumable-card {
  background: #fff;
  border-radius: 8px;
  padding: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.card-header, .stock-card-header, .repair-card-header, .employee-card-header, .lark-card-header, .consumable-card-header {
  padding: 14px 16px;
  color: #fff;
  border-radius: 8px 8px 0 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-header {
  background: #1a6b5c;
}
.stock-card-header {
  background: #c45c26;
}
.repair-card-header {
  background: #3d6b8a;
}
.employee-card-header {
  background: #b86e2a;
}
.lark-card-header {
  background: #3a7ca5;
}
.consumable-card-header {
  background: #5b7c6a;
}
.card-no, .stock-asset-no, .repair-asset-no, .employee-name, .lark-name, .consumable-no {
  font-size: 14px;
  font-weight: 700;
}
.card-brand {
  font-size: 12px;
  opacity: 0.9;
  margin-top: 2px;
}
.card-header .status-tag {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.4);
}
.card-body, .stock-card-body, .repair-card-body, .employee-card-body, .lark-card-body, .consumable-card-body {
  padding: 12px 16px;
}
.card-row {
  display: flex;
  margin-bottom: 8px;
  font-size: 13px;
}
.card-row .label {
  color: #999;
  min-width: 60px;
}
.card-row .value {
  color: #333;
  flex: 1;
}
.card-footer {
  padding: 10px 16px;
  border-top: 1px solid #f0f0f0;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
/* 操作按钮按文案自适应，避免「编辑」等短文案被 flex 拉得比邻钮更宽 */
.card-footer .el-button {
  flex: 0 0 auto;
  width: auto !important;
  min-width: 0;
  margin: 0;
}

.table-toolbar { padding:16px 20px; display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0; flex-wrap:wrap; }
.table-toolbar .toolbar-left { display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1; min-width: 0; }
.table-toolbar .toolbar-right { display:flex;gap:8px; }

/* 表格工具栏筛选项的响应式 */
.toolbar-filter { flex-shrink: 0; }

/* 全局表格样式 - 使用自动布局，允许横向滚动 */
.el-table {
  border-collapse: separate;
  border-spacing: 0;
}

/* 表头样式 - 强制不换行 */
.el-table__header th,
.el-table__header th .cell {
  white-space: nowrap !important;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 23px !important;
}

/* 单元格样式 */
.el-table__cell {
  padding: 8px 0 !important;
}

/* 表格内容容器支持横向滚动 */
.el-table__body-wrapper,
.el-table__header-wrapper {
  overflow-x: auto !important;
}

/* 表格卡片内的表格容器支持滚动（不设全局 min-width，避免竖屏整页被撑开） */
.table-card {
  overflow-x: auto;
  max-width: 100%;
}

/* 强制表头行高度一致 */
.el-table__header-wrapper .el-table__header thead tr {
  height: 40px !important;
}

.el-table__header th > .cell {
  display: inline-block !important;
  vertical-align: middle;
}

/* 状态标签 */
.status-tag { display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500; }
.status-tag.在库    { background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f; }
.status-tag.在用    { background:#e6f4ff;color:#1677ff;border:1px solid #91caff; }
.status-tag.维修中  { background:#fff7e6;color:#fa8c16;border:1px solid #ffd591; }
.status-tag.已报废  { background:#fff1f0;color:#ff4d4f;border:1px solid #ffa39e; }
.status-tag.已出库  { background:#f5f5f5;color:#8c8c8c;border:1px solid #d9d9d9; }

/* 图表区 */
.charts-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
.chart-card { background:#fff; border-radius:12px; padding:18px 20px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.chart-card .chart-title { font-size:14px;font-weight:600;color:#1a1f35;margin-bottom:14px; }

/* 表单弹窗 */
.el-dialog .dialog-section-title { font-size:13px;font-weight:600;color:#8c8c8c;padding:0 0 8px;border-bottom:1px solid #f0f0f0;margin-bottom:12px; }

/* 实物图/发票上传区域 */
.photo-upload-area {
  border: 1.5px dashed #d9d9d9; border-radius: 8px;
  padding: 12px 14px; background: #fafafa; transition: border-color .2s;
}
.photo-upload-area:hover { border-color: #4096ff; }
.photo-upload-label { font-size: 12px; color: #8c8c8c; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.photo-upload-label strong { color: #595959; font-size: 13px; }
.photo-upload-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
  background: #fff; border: 1px solid #d9d9d9; color: #595959;
  transition: all .2s;
}
.photo-upload-btn:hover { border-color: #4096ff; color: #4096ff; background: #e6f4ff; }
.photo-upload-btn input[type=file] { display: none; }
.photo-preview-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.photo-preview-item {
  position: relative; width: 64px; height: 64px; border-radius: 6px;
  overflow: hidden; border: 1px solid #e8e8e8;
}
.photo-preview-item img { width: 100%; height: 100%; object-fit: cover; }
.photo-preview-item .remove-btn {
  position: absolute; top: 2px; right: 2px; width: 16px; height: 16px;
  background: rgba(0,0,0,.55); color: #fff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; cursor: pointer; line-height: 1;
}
.photo-preview-item .remove-btn:hover { background: #ff4d4f; }
.photo-file-item {
  display: flex; align-items: center; gap: 6px; padding: 4px 8px;
  background: #f2f8f6; border-radius: 4px; font-size: 12px; color: #1677ff;
}
.photo-file-item .remove-btn { color: #ff4d4f; cursor: pointer; font-size: 14px; line-height: 1; }

/* 操作日志 */
.log-item { display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5; }
.log-item .log-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px; }
.log-item .log-dot.入库  { background:#52c41a; }
.log-item .log-dot.出库  { background:#1677ff; }
.log-item .log-dot.归还  { background:#fa8c16; }
.log-item .log-dot.调拨  { background:#722ed1; }
.log-item .log-dot.维修  { background:#ff4d4f; }
.log-item .log-content { flex:1;font-size:13px;color:#333; }
.log-item .log-time { font-size:11px;color:#bbb; }

/* 分页 */
.table-footer { padding:12px 20px;display:flex;justify-content:flex-end;border-top:1px solid #f0f0f0; }

.lark-badge { display:inline-flex;align-items:center;gap:4px;background:#00b0f0;color:#fff;padding:2px 8px;border-radius:4px;font-size:11px; }
.repair-priority.高 { color:#ff4d4f; font-weight:600; }
.repair-priority.中 { color:#fa8c16; }
.repair-priority.低 { color:#52c41a; }

.empty-state { text-align:center;padding:60px 20px;color:#bbb; }
.empty-state .empty-icon { font-size:48px;margin-bottom:12px; }
.empty-state .empty-text { font-size:16px;margin-bottom:8px;color:#8c8c8c; }
.empty-state .empty-hint { font-size:13px;color:#bfbfbf; }

/* 采购订单状态标签 */
.status-pending { background:#fff7e6;color:#fa8c16;border:1px solid #ffd591; }
.status-partial { background:#e6f4ff;color:#1677ff;border:1px solid #91caff; }
.status-done { background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f; }
.status-cancel { background:#fff1f0;color:#ff4d4f;border:1px solid #ffa39e; }

/* 权限标签样式增强 */
.el-tag.el-tag--danger { background-color: #fff1f0; border-color: #ffa39e; color: #ff4d4f; }
.el-tag.el-tag--warning { background-color: #fff7e6; border-color: #ffd591; color: #fa8c16; }
.el-tag.el-tag--primary { background-color: #e6f4ff; border-color: #91caff; color: #1677ff; }
.el-tag.el-tag--success { background-color: #f6ffed; border-color: #b7eb8f; color: #52c41a; }
.el-tag.el-tag--info { background-color: #f5f5f5; border-color: #d9d9d9; color: #8c8c8c; }

/* 响应式 */
@media (max-width: 1024px) {
  .charts-row { grid-template-columns: 1fr; }
  .table-toolbar .toolbar-left { gap: 8px; }
  .search-input { width: 200px !important; }
  .desktop-only { display: none !important; }
  .mobile-only, .mobile-card-list.mobile-only { display: flex !important; flex-direction: column; }
}

@media (max-width: 768px) {
  html, body { overflow-x: hidden; max-width: 100vw; }
  .app-layout, .main-content, .page-content { max-width: 100vw; overflow-x: hidden; }
  .mobile-toggle { display: flex; }
  .sidebar { transform: translateX(-100%); width: 220px; }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .topbar { padding: 0 16px; }
  .page-content { padding: 16px; }
  .stat-cards { grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 12px; }
  .charts-row { grid-template-columns: 1fr; }
  .stat-card .value { font-size: 24px; }
  .table-toolbar { padding: 12px 16px; flex-direction: column; align-items: stretch; }
  .table-toolbar .toolbar-left { width: 100%; margin-bottom: 8px; flex-wrap: wrap; }
  .table-toolbar .toolbar-right { width: 100%; justify-content: flex-end; }
  .search-input { width: 100% !important; }
  .chart-card { padding: 14px 16px; }
  .chart-card .chart-title { font-size: 13px; margin-bottom: 10px; }
  .table-wrapper, .table-card {
    min-width: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
  }
  .table-card .table-wrapper[style],
  .page-content .table-wrapper[style] {
    min-width: 0 !important;
    width: 100% !important;
  }
  .hide-on-tablet { display: none !important; }
  .desktop-only { display: none !important; }
  .mobile-only { display: flex !important; flex-direction: column; }
  .el-dialog {
    width: calc(100vw - 24px) !important;
    max-width: calc(100vw - 24px) !important;
    margin: 12px auto !important;
  }
  .el-overlay-dialog { overflow-y: auto; }
  .card-row { flex-direction: column; align-items: flex-start; gap: 2px; margin-bottom: 10px; }
  .card-row .label { min-width: 0; font-size: 12px; }
  .card-row .value { width: 100%; word-break: break-word; }
  .card-footer .el-button { flex: 0 0 auto; width: auto !important; min-width: 0; }
  .fields-embed-wrap { height: calc(100vh - 56px) !important; min-height: 420px; margin: 0 -4px; }
  .fields-embed-wrap iframe { border-radius: 0 !important; }
  .emp-role-alert { height: auto !important; padding: 8px 12px !important; }
  .emp-role-alert .el-alert__content { white-space: normal !important; line-height: 1.4; }
  .emp-search-input { width: 100% !important; }
  .lark-help code { word-break: break-all; font-size: 11px; }
  .page-employees .table-toolbar .toolbar-left,
  .page-lark .table-toolbar { align-items: stretch; }
  .page-employees .table-toolbar .toolbar-right,
  .page-lark .table-toolbar .toolbar-right { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
  .page-employees .table-toolbar .toolbar-right .el-button,
  .page-lark .table-toolbar .toolbar-right .el-button { width: auto !important; flex: 0 0 auto; }
}

@media (max-width: 480px) {
  .stat-cards { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card .value { font-size: 20px; }
  .stat-card { padding: 14px 16px; }
  .table-toolbar .toolbar-right { flex-wrap: wrap; }
  .table-toolbar .toolbar-right .el-button { width: auto !important; flex: 0 0 auto; }
  .page-content { padding: 12px; }
  .hide-on-mobile { display: none !important; }
}
</style>
<!-- 同步守卫：在 JS 加载前就阻断非管理角色访问管理后台（避免渲染 dashboard 数据再跳转的中间窗口）
     判定统一走 ams-role.js 白名单：只认 超管/管理员/普通管理员/操作员/财务，
     其余一律视为普通用户（含 role='user' 的历史数据）。 -->
<script>
(function() {
  try {
    var raw = localStorage.getItem('ams_user');
    if (!raw) return; // 没缓存用户信息，交给下面的 directAuth 处理
    var u = JSON.parse(raw);
    if (!u || !u.role) return; // 角色未知时不猜，避免误伤管理角色
    if (!window.amsIsAdmin(u.role)) {
      // 已在 /my.html 则不再跳（防止自我重定向造成闪屏）
      if (location.pathname === '/my.html') return;
      window.location.replace('/my.html' + (location.search || ''));
    }
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="app">
<div class="app-layout">
  <!-- 移动端侧边栏遮罩 -->
  <div class="sidebar-overlay" :class="{active:mobileSidebarOpen}" @click="toggleMobileSidebar"></div>

  <!-- 侧边栏（普通用户不可见，避免看到管理后台导航） -->
  <aside class="sidebar" :class="{open:mobileSidebarOpen}" v-if="!isRegularUser">
    <div class="sidebar-logo">
      <div class="logo-icon">📦</div>
      <div>
        <div class="logo-text">资产管理系统</div>
        <div class="logo-sub">Asset Management</div>
      </div>
    </div>
    <nav class="nav-menu">
      <div class="nav-group-title" v-if="canSeeMenu('dashboard')">概览</div>
      <div class="nav-item" v-if="canSeeMenu('dashboard')" :class="{active:page==='dashboard'}" @click="page='dashboard';mobileSidebarOpen=false">
        <span class="nav-icon">📊</span><span>仪表盘</span>
      </div>
      <div class="nav-group-title" v-if="canSeeMenu('quick_stock')||canSeeMenu('quick_repair')||canSeeMenu('quick_dispose')">快速操作</div>
      <div class="nav-item" v-if="canSeeMenu('quick_stock')" @click="goStandalone('stock.html')">
        <span class="nav-icon">📦</span><span>出入库</span>
      </div>
      <div class="nav-item" v-if="canSeeMenu('quick_repair')" @click="goStandalone('repair.html')">
        <span class="nav-icon">🔧</span><span>报修</span>
      </div>
      <div class="nav-item" v-if="canSeeMenu('quick_dispose')" @click="goStandalone('dispose.html')">
        <span class="nav-icon">🗑️</span><span>资产处理</span>
      </div>
      <div class="nav-group-title" v-if="canSeeMenu('assets')||canSeeMenu('stock')||canSeeMenu('repair')||canSeeMenu('dispose')">固定资产</div>
      <div class="nav-item" v-if="canSeeMenu('assets')" :class="{active:page==='assets'}" @click="page='assets';loadAssets();mobileSidebarOpen=false">
        <span class="nav-icon">🖥️</span><span>资产台账</span>
      </div>
      <div class="nav-item" v-if="canSeeMenu('stock')" :class="{active:page==='stock'}" @click="page='stock';loadStockLogs();mobileSidebarOpen=false">
        <span class="nav-icon">📋</span><span>出入库记录</span>
      </div>
      <div class="nav-item" v-if="canSeeMenu('repair')" :class="{active:page==='repair'}" @click="page='repair';loadRepairs();mobileSidebarOpen=false">
        <span class="nav-icon">🔧</span><span>维修管理</span>
      </div>
      <div class="nav-item" v-if="canSeeMenu('dispose')" :class="{active:page==='dispose'}" @click="page='dispose';loadDisposeLogs();mobileSidebarOpen=false">
        <span class="nav-icon">🗑️</span><span>资产处理记录</span>
      </div>
      <div class="nav-group-title" v-if="canSeeMenu('consumables')||canSeeMenu('consumable_logs')">耗材管理</div>
      <div class="nav-item" v-if="canSeeMenu('consumables')" :class="{active:page==='consumables'}" @click="page='consumables';loadConsumables();mobileSidebarOpen=false">
        <span class="nav-icon">🧪</span><span>耗材台账</span>
      </div>
      <div class="nav-item" v-if="canSeeMenu('consumable_logs')" :class="{active:page==='consumable_logs'}" @click="page='consumable_logs';loadConsumableLogs();mobileSidebarOpen=false">
        <span class="nav-icon">📦</span><span>耗材领用记录</span>
      </div>
      <div class="nav-group-title" v-if="canSeeMenu('approval')||canSeeMenu('inventory')">管理</div>
      <div class="nav-item" v-if="canSeeMenu('approval')" :class="{active:page==='approval'}" @click="page='approval';approvalTab='approvals';loadApprovals();loadFulfillable();mobileSidebarOpen=false">
        <span class="nav-icon">📋</span><span>审批中心</span>
        <span v-if="(stats.pending_approvals||0)+(stats.fulfillable_count||0)>0"
              style="margin-left:auto;background:#ff4d4f;color:#fff;font-size:11px;padding:0 6px;border-radius:10px;line-height:18px;min-width:18px;text-align:center">
          {{ (stats.pending_approvals||0)+(stats.fulfillable_count||0) }}
        </span>
      </div>
      <div class="nav-item" v-if="canSeeMenu('inventory')" :class="{active:page==='inventory'}" @click="page='inventory';loadInventories();mobileSidebarOpen=false">
        <span class="nav-icon">📦</span><span>资产盘点</span>
      </div>
      <div class="nav-group-title" v-if="canSeeMenu('orders')">采购</div>
      <div class="nav-item" v-if="canSeeMenu('orders')" :class="{active:page==='orders'}" @click="page='orders';loadOrders();mobileSidebarOpen=false">
        <span class="nav-icon">🛒</span><span>采购订单</span>
      </div>
      <div class="nav-group-title" v-if="canSeeMenu('fields')||canSeeMenu('employees')||canSeeMenu('lark')||canSeeMenu('settings')">配置</div>
      <div class="nav-item" v-if="canSeeMenu('fields')" :class="{active:page==='fields'}" @click="page='fields';loadFields();mobileSidebarOpen=false">
        <span class="nav-icon">🔧</span><span>字段维护</span>
      </div>
      <div class="nav-item" v-if="canSeeMenu('employees')" :class="{active:page==='employees'}" @click="page='employees';loadEmployees();mobileSidebarOpen=false">
        <span class="nav-icon">👥</span><span>用户管理</span>
      </div>
      <div class="nav-item" v-if="canSeeMenu('lark')" :class="{active:page==='lark'}" @click="page='lark';loadLarkConfig();mobileSidebarOpen=false">
        <span class="nav-icon">🔔</span><span>飞书通知</span>
      </div>
      <div class="nav-item" v-if="canSeeMenu('settings')" :class="{active:page==='settings'}" @click="page='settings';loadConfig();mobileSidebarOpen=false">
        <span class="nav-icon">⚙️</span><span>系统设置</span>
      </div>
    </nav>
  </aside>

  <!-- 主内容 -->
  <main class="main-content">
    <!-- 认证加载中 -->
    <div v-if="authLoading" class="auth-overlay">
      <div class="auth-loading">
        <el-icon class="is-loading" :size="40"><Loading /></el-icon>
        <p>正在验证登录状态...</p>
      </div>
    </div>
    
    <!-- 未登录兜底（理论上 directAuth 已重定向到登录页） -->
    <div v-else-if="!isLoggedIn" class="auth-overlay">
      <div class="auth-error">
        <div class="error-icon">🔐</div>
        <h3>未登录</h3>
        <p>请先登录后再访问系统</p>
        <el-button type="primary" @click="goToLogin">去登录</el-button>
      </div>
    </div>

    <!-- 普通用户：应进入个人门户，此处仅作跳转占位，不渲染任何后台导航 -->
    <div v-else-if="isRegularUser" class="auth-overlay">
      <div class="auth-loading">
        <el-icon class="is-loading" :size="40"><Loading /></el-icon>
        <p>正在跳转到个人门户...</p>
      </div>
    </div>

    <template v-else-if="isLoggedIn">
    <header class="topbar">
      <div class="mobile-toggle" @click="toggleMobileSidebar">☰</div>
      <div class="topbar-title">{{ pageTitle }}</div>
      <div class="topbar-right">
        <el-tag v-if="larkConnected" type="success" size="small">飞书已连接</el-tag>
        <el-tag v-if="isSuperAdmin" type="danger" size="small" effect="dark">超管</el-tag>
        <span style="font-size:12px;color:#8c8c8c">{{ new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}) }}</span>
        
        <!-- 用户头像下拉菜单 -->
        <el-dropdown trigger="click" popper-class="user-dropdown-menu">
          <div class="user-avatar-dropdown">
            <div class="user-avatar" v-if="!currentUser.avatar">
              {{ currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U' }}
            </div>
            <div class="user-avatar" v-else>
              <img :src="currentUser.avatar" alt="avatar">
            </div>
          </div>
          <template #dropdown>
            <el-dropdown-menu>
              <div class="user-dropdown-header">
                <div class="user-info-row">
                  <div class="user-avatar-large" v-if="!currentUser.avatar">
                    {{ currentUser.name ? currentUser.name.charAt(0).toUpperCase() : 'U' }}
                  </div>
                  <div class="user-avatar-large" v-else>
                    <img :src="currentUser.avatar" alt="avatar">
                  </div>
                  <div class="user-meta">
                    <div class="user-name">{{ currentUser.name || '未登录' }}</div>
                    <div class="user-role">{{ currentUser.role || '访客' }}</div>
                    <div class="user-source" v-if="currentUser.source === 'lark'">
                      <span>🚀</span> Lark 登录
                    </div>
                  </div>
                </div>
              </div>
              <el-dropdown-item @click="showUserProfile">
                <el-icon><User /></el-icon> 个人中心
              </el-dropdown-item>
              <el-dropdown-item @click="showSettings">
                <el-icon><Setting /></el-icon> 账号设置
              </el-dropdown-item>
              <el-dropdown-item divided @click="switchToUserView">
                <el-icon><RefreshRight /></el-icon> 切换到普通用户视图
              </el-dropdown-item>
              <el-dropdown-item divided @click="handleLogout">
                <el-icon><SwitchButton /></el-icon> 退出登录
              </el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
      </div>
    </header>

    <div class="page-content">

      <!-- ══════════ 仪表盘 ══════════ -->
      <div v-if="page==='dashboard'">
        <!-- 固定资产统计 -->
        <div style="font-size:14px;font-weight:600;color:#1a1f35;margin-bottom:12px;">📦 固定资产</div>
        <div class="stat-cards">
          <div class="stat-card blue"   @click="goAssets()"><div class="label">资产总数</div><div class="value">{{ stats.total || 0 }}</div></div>
          <div class="stat-card green"  @click="goAssets('在库')"><div class="label">在库</div><div class="value">{{ stats.in_stock || 0 }}</div></div>
          <div class="stat-card"    style="cursor:pointer" @click="goAssets('在用')"><div class="label">在用</div><div class="value" style="color:#1677ff">{{ stats.in_use || 0 }}</div></div>
          <div class="stat-card orange" @click="goRepair()"><div class="label">维修中</div><div class="value">{{ stats.repairing || 0 }}</div></div>
          <div class="stat-card gray"  ><div class="label">已报废</div><div class="value">{{ stats.scrapped || 0 }}</div></div>
        </div>

        <!-- 账与待办（数字为 0 也显示，便于看出本页能力） -->
        <div style="font-size:14px;font-weight:600;color:#1a1f35;margin:20px 0 12px;">💰 账与待办</div>
        <div class="stat-cards">
          <div class="stat-card purple" style="cursor:default">
            <div class="label">资产原值</div>
            <div class="value" style="font-size:22px">¥{{ formatMoney(stats.purchase_value) }}</div>
          </div>
          <div class="stat-card blue" style="cursor:default">
            <div class="label">账面价值</div>
            <div class="value" style="font-size:22px">¥{{ formatMoney(stats.book_value_total) }}</div>
          </div>
          <div class="stat-card orange" style="cursor:pointer" @click="goApprovalTab('approvals')">
            <div class="label">待审批</div>
            <div class="value">{{ stats.pending_approvals || 0 }}</div>
          </div>
          <div class="stat-card" style="cursor:pointer" @click="goApprovalTab('fulfill')">
            <div class="label">待发放</div>
            <div class="value" style="color:#1677ff">{{ stats.fulfillable_count || 0 }}</div>
          </div>
          <div class="stat-card red" style="cursor:pointer" @click="openWarrantyPanel()">
            <div class="label">保修到期</div>
            <div class="value">{{ stats.warranty_alert_count || 0 }}</div>
          </div>
          <div class="stat-card" style="cursor:pointer" @click="page='inventory';loadInventories();mobileSidebarOpen=false">
            <div class="label">进行中盘点</div>
            <div class="value" style="color:#722ed1">{{ stats.inventory_ongoing || 0 }}</div>
          </div>
          <div class="stat-card orange" style="cursor:pointer" @click="openIdlePanel()">
            <div class="label">闲置超过90天</div>
            <div class="value">{{ stats.idle_count || 0 }}</div>
          </div>
          <div class="stat-card green" :style="{cursor: canSeeMenu('orders') ? 'pointer' : 'default'}" @click="goOrdersFromDash()">
            <div class="label">未完成采购金额</div>
            <div class="value" style="font-size:22px">¥{{ formatMoney(stats.pending_po_amount) }}</div>
          </div>
          <div class="stat-card" :style="{cursor: canSeeMenu('orders') ? 'pointer' : 'default'}" @click="goOrdersFromDash()">
            <div class="label">未到货订单</div>
            <div class="value" style="color:#1a6b5c">{{ stats.pending_po_count || 0 }}</div>
          </div>
          <div class="stat-card orange" :style="{cursor: canSeeMenu('orders') ? 'pointer' : 'default'}" @click="goOrdersFromDash()">
            <div class="label">未到票订单</div>
            <div class="value">{{ stats.uninvoiced_po_count || 0 }}</div>
          </div>
        </div>

        <!-- 闲置在库明细 -->
        <div class="table-card" style="margin:16px 0 20px" v-show="showIdlePanel" ref="idlePanelEl">
          <div style="padding:12px 16px;font-size:13px;font-weight:600;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center">
            <span>📦 闲置在库（入库超过 90 天仍在库）</span>
            <el-button size="small" @click="showIdlePanel=false">收起</el-button>
          </div>
          <table class="plain-table" style="width:100%">
            <thead>
              <tr>
                <th>资产编号</th>
                <th>类目</th>
                <th>存放地</th>
                <th>入库日</th>
                <th>已闲置天数</th>
              </tr>
            </thead>
            <tbody>
              <tr v-if="!(stats.idle_assets||[]).length">
                <td colspan="5"><div style="padding:24px 0;text-align:center;color:#bfbfbf">暂无闲置超过 90 天的在库资产</div></td>
              </tr>
              <tr v-for="item in (stats.idle_assets||[])" :key="'idle'+item.id">
                <td>
                  <el-button type="primary" link size="small" @click="page='assets';loadAssets()">{{ item.asset_no }}</el-button>
                </td>
                <td>{{ item.category || '-' }}</td>
                <td>{{ item.location || '-' }}</td>
                <td>{{ item.purchase_date }}</td>
                <td>
                  <span style="font-size:12px;padding:2px 8px;border-radius:4px;font-weight:600;background:#fffbe6;color:#d46b08">
                    {{ item.idle_days }} 天
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 保修到期明细（点击上方「保修到期」展开；有数据时默认展开） -->
        <div class="table-card" style="margin:16px 0 20px" v-show="showWarrantyPanel" ref="warrantyPanelEl">
          <div style="padding:12px 16px;font-size:13px;font-weight:600;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center">
            <span>🛡️ 保修到期明细（已过期 / 30 天内）</span>
            <div>
              <el-button size="small" @click="exportAlerts">导出提醒</el-button>
              <el-button size="small" @click="showWarrantyPanel=false">收起</el-button>
            </div>
          </div>
          <table class="plain-table" style="width:100%">
            <thead>
              <tr>
                <th>资产编号</th>
                <th>类目</th>
                <th>关联人</th>
                <th>保修到期日</th>
                <th>剩余天数</th>
              </tr>
            </thead>
            <tbody>
              <tr v-if="!(stats.warranty_alerts||[]).length">
                <td colspan="5"><div style="padding:24px 0;text-align:center;color:#bfbfbf">暂无保修到期提醒</div></td>
              </tr>
              <tr v-for="item in (stats.warranty_alerts||[])" :key="'w'+item.id">
                <td>
                  <el-button type="primary" link size="small" @click="page='assets';loadAssets()">{{ item.asset_no }}</el-button>
                </td>
                <td>{{ item.category || '-' }}</td>
                <td>{{ item.assignee || '-' }}</td>
                <td>{{ item.warranty_expire }}</td>
                <td>
                  <span :style="{
                    fontSize:'12px', padding:'2px 8px', borderRadius:'4px', fontWeight:'600',
                    background: item.expire_status==='expired' ? '#fff1f0' : '#fffbe6',
                    color: item.expire_status==='expired' ? '#cf1322' : '#d46b08'
                  }">
                    <span v-if="item.expire_status==='expired'">已过期 {{ Math.abs(item.days_left) }} 天</span>
                    <span v-else>还剩 {{ item.days_left }} 天</span>
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 耗材统计 -->
        <div style="font-size:14px;font-weight:600;color:#1a1f35;margin:20px 0 12px;display:flex;align-items:center;justify-content:space-between;">
          <span>🧪 耗材管理</span>
          <el-button size="small" type="primary" plain @click="exportAlerts">导出提醒</el-button>
        </div>
        <div class="stat-cards">
          <div class="stat-card purple" @click="page='consumables';loadConsumables();"><div class="label">耗材种类</div><div class="value">{{ stats.consumable_total || 0 }}</div></div>
          <div class="stat-card green" @click="page='consumables';loadConsumables();"><div class="label">库存正常</div><div class="value">{{ stats.consumable_normal || 0 }}</div></div>
          <div class="stat-card red" @click="page='consumables';loadConsumables();viewLowStockConsumables();"><div class="label">库存预警</div><div class="value">{{ stats.consumable_low || 0 }}</div></div>
        </div>

        <!-- 订阅续期提醒 -->
        <template v-if="expireReminder.total > 0">
          <div style="font-size:14px;font-weight:600;color:#1a1f35;margin:20px 0 12px;">🔔 订阅续期提醒</div>
          <div class="stat-cards" style="margin-bottom:12px">
            <div class="stat-card red" style="cursor:default" v-if="expireReminder.expired_count>0">
              <div class="label">❌ 已过期</div>
              <div class="value">{{ expireReminder.expired_count }}</div>
            </div>
            <div class="stat-card orange" style="cursor:default" v-if="expireReminder.warning_count>0">
              <div class="label">⚠️ 即将到期</div>
              <div class="value">{{ expireReminder.warning_count }}</div>
            </div>
            <div class="stat-card green" style="cursor:default" v-if="expireReminder.normal_count>0">
              <div class="label">✅ 正常</div>
              <div class="value">{{ expireReminder.normal_count }}</div>
            </div>
          </div>
          <!-- 明细列表 -->
          <div class="table-card" style="margin-bottom:20px">
            <div style="padding:12px 16px;font-size:13px;font-weight:600;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center">
              <span>订阅制资产到期明细</span>
              <div>
                <el-button size="small" @click="exportAlerts">导出提醒</el-button>
                <el-button size="small" @click="loadExpireReminder">刷新</el-button>
              </div>
            </div>
            <table class="plain-table" style="width:100%">
              <thead>
                <tr>
                  <th>资产编号</th>
                  <th>品牌/产品</th>
                  <th>关联人</th>
                  <th>到期日</th>
                  <th>剩余天数</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="item in expireReminder.data" :key="item.id">
                  <td>
                    <el-button type="primary" link size="small" @click="page='assets';loadAssets()">{{ item.asset_no }}</el-button>
                  </td>
                  <td>{{ item.brand }} {{ item.model || item.category }}</td>
                  <td>{{ item.assignee || '-' }}</td>
                  <td>{{ item.expire_date }}</td>
                  <td>
                    <span :style="{
                      fontSize:'12px', padding:'2px 8px', borderRadius:'4px', fontWeight:'600',
                      background: item.expire_status==='expired' ? '#fff1f0' : item.expire_status==='warning' ? '#fffbe6' : '#f6ffed',
                      color: item.expire_status==='expired' ? '#cf1322' : item.expire_status==='warning' ? '#d46b08' : '#389e0d'
                    }">
                      <span v-if="item.expire_status==='expired'">已过期 {{ Math.abs(item.days_left) }} 天</span>
                      <span v-else-if="item.expire_status==='warning'">还剩 {{ item.days_left }} 天</span>
                      <span v-else>{{ item.days_left }} 天</span>
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </template>

        <div class="charts-row">

<!-- ══════════ 审批中心 ══════════ -->

    </el-radio-group>
  </div>

  <template v-if="approvalTab==='approvals'">
  <div class="table-card" style="padding:16px 20px;margin-bottom:16px">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <el-select v-model="approvalFilter.status" placeholder="审批状态" clearable @change="loadApprovals" style="width:140px">
        <el-option label="待审批" value="pending"></el-option>

      </el-select>

        <el-option label="资产转移" value="资产转移"></el-option>
        <el-option label="资产出库" value="资产出库"></el-option>
        <el-option label="资产回收" value="资产回收"></el-option>
        <el-option label="借用出库" value="借用出库"></el-option>
        <el-option label="借用归还" value="借用归还"></el-option>
        <el-option label="资产调拨" value="资产调拨"></el-option>
        <el-option label="维修申请" value="维修申请"></el-option>
        <el-option label="资产处置" value="资产处置"></el-option>

            <td style="font-family:monospace">{{ row.apply_no || row.id }}</td>
            <td><el-tag size="small" :type="row.apply_type==='资产删除'?'danger':'primary'">{{ row.apply_type }}</el-tag></td>
            <td>{{ row.asset_info || row.asset_no }}</td>
            <td>{{ row.applicant }}</td>
            <td style="font-size:12px;color:#8c8c8c">{{ row.apply_time }}</td>
            <td><el-tag size="small" :type="row.status==='已通过'?'success':row.status==='已驳回'?'danger':'warning'">{{ row.status }}</el-tag></td>
            <td>{{ row.approver || '-' }}</td>

  <template v-else>

            </td>
            <td><el-button size="small" type="primary" @click="openFulfillDialog(row)">发放</el-button></td>
          </tr>
        </tbody>
      </table>

</div>

<!-- 确认发放弹窗 -->
<el-dialog v-model="fulfillDlg.visible" title="确认发放" width="520px">

        {{ inventoryStatusLabel(inventoryWorkbench.task?.status) }}
      </el-tag>
      <span style="color:#8c8c8c;font-size:13px">

<!-- ══════════ 出入库/报修/资产处理 已改为独立页面顶层跳转（飞书 webview 禁止 iframe） ══════════ -->

      </el-col>
      <el-col :span="8">
        <el-form-item label="存放地" required>

      <el-col :span="12">
        <el-form-item label="类目">

      <el-col :span="12">
        <el-form-item label="品牌">

      </el-col>
      <el-col :span="12">
        <el-form-item label="型号">
          <el-input v-model="assetDialog.form.model"/>
        </el-form-item>
      </el-col>
      <el-col :span="24">
        <el-form-item label="配置信息">

      <el-col :span="12"><el-form-item label="有线 MAC"><el-input v-model="assetDialog.form.mac_wired"/></el-form-item></el-col>
      <el-col :span="12"><el-form-item label="无线 MAC"><el-input v-model="assetDialog.form.mac_wireless"/></el-form-item></el-col>
      <el-col :span="12"><el-form-item label="KEY"><el-input v-model="assetDialog.form.key_info"/></el-form-item></el-col>
      <el-col :span="24">

      </el-col>
      <el-col :span="12" v-if="assetDialog.form.account_enabled">

      </el-col>
      <el-col :span="12" v-if="assetDialog.form.account_enabled">
        <el-form-item label="密码"><el-input v-model="assetDialog.form.account_password" show-password placeholder="填写密码"/></el-form-item>

    <template v-if="assetDialog.form.asset_class === 'software'">

      <el-row :gutter="16">
        <el-col :span="12">
          <el-form-item label="授权类型" required>
            <el-select v-model="assetDialog.form.license_type" placeholder="请选择" style="width:100%">
              <el-option label="订阅制（按期续费）" value="subscription"></el-option>
              <el-option label="买断制（永久授权）" value="perpetual"></el-option>

          </el-form-item>
        </el-col>
        <el-col :span="12">
          <el-form-item label="席位/授权数">
            <el-input-number v-model="assetDialog.form.seat_count" :min="1" placeholder="可选" style="width:100%"/>
          </el-form-item>
        </el-col>
        <el-col :span="12">
          <el-form-item label="激活码/KEY">
            <el-input v-model="assetDialog.form.key_info" placeholder="序列号/激活码"/>
          </el-form-item>
        </el-col>
        <el-col :span="24">
          <el-form-item label="关联账号密码">
            <el-checkbox v-model="assetDialog.form.account_enabled">需要关联账号密码</el-checkbox>
          </el-form-item>
        </el-col>
        <el-col :span="12" v-if="assetDialog.form.account_enabled">
          <el-form-item label="账号"><el-input v-model="assetDialog.form.account_name" placeholder="填写账号"/></el-form-item>
        </el-col>
        <el-col :span="12" v-if="assetDialog.form.account_enabled">
          <el-form-item label="密码"><el-input v-model="assetDialog.form.account_password" show-password placeholder="填写密码"/></el-form-item>
        </el-col>
        <template v-if="assetDialog.form.license_type === 'subscription'">
          <el-col :span="12">
            <el-form-item label="到期日" required>
              <el-date-picker v-model="assetDialog.form.expire_date" type="date" value-format="YYYY-MM-DD" placeholder="订阅到期日" style="width:100%"/>
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="提前提醒(天)">
              <el-input-number v-model="assetDialog.form.renew_remind_days" :min="1" :max="365" style="width:100%"/>
            </el-form-item>
          </el-col>
        </template>
      </el-row>
    </template>
    <div class="dialog-section-title" style="margin-top:8px">使用状态</div>
    <el-row :gutter="16">
      <el-col :span="12">
        <el-form-item label="状态">
          <el-select v-model="assetDialog.form.status" style="width:100%">
            <el-option label="在库" value="在库">
              <span style="display:flex;align-items:center;gap:8px">
                <span style="width:8px;height:8px;border-radius:50%;background:#52c41a;flex-shrink:0"></span>在库
              </span>
            </el-option>
            <el-option label="在用" value="在用">
              <span style="display:flex;align-items:center;gap:8px">
                <span style="width:8px;height:8px;border-radius:50%;background:#1677ff;flex-shrink:0"></span>在用
              </span>
            </el-option>
            <el-option label="维修中" value="维修中">
              <span style="display:flex;align-items:center;gap:8px">
                <span style="width:8px;height:8px;border-radius:50%;background:#fa8c16;flex-shrink:0"></span>维修中
              </span>
            </el-option>
            <el-option label="已报废" value="已报废">
              <span style="display:flex;align-items:center;gap:8px">
                <span style="width:8px;height:8px;border-radius:50%;background:#ff4d4f;flex-shrink:0"></span>已报废
              </span>
            </el-option>
            <el-option label="已出库" value="已出库">
              <span style="display:flex;align-items:center;gap:8px">
                <span style="width:8px;height:8px;border-radius:50%;background:#8c8c8c;flex-shrink:0"></span>已出库
              </span>
            </el-option>
          </el-select>
        </el-form-item>
      </el-col>
      <el-col :span="12">
        <el-form-item label="可借标记">
          <el-switch v-model="assetDialog.form.is_borrowable"
            active-text="可借" inactive-text="不可借"
            active-value="1" inactive-value="0"
            style="--el-switch-on-color: #1a6b5c"/>
          <div style="font-size:11px;color:#999;margin-top:2px">开启后，该资产将出现在"借用资产"的可选列表中</div>
        </el-form-item>
      </el-col>
      <el-col :span="12">
        <el-form-item label="存放地">
          <el-select v-model="assetDialog.form.location" allow-create filterable style="width:100%">
            <el-option v-for="l in meta.locations" :key="l" :label="l" :value="l"></el-option>
          </el-select>
        </el-form-item>
      </el-col>
      <el-col :span="12">
        <el-form-item label="关联人">
          <el-select v-model="assetDialog.form.assignee" allow-create filterable clearable style="width:100%">
            <el-option v-for="e in employeeList" :key="e.id" :label="e.name" :value="e.name"></el-option>
          </el-select>
        </el-form-item>
      </el-col>
      <el-col :span="12">
        <el-form-item label="经办人">
          <el-input v-model="assetDialog.form.operator" placeholder="操作人姓名"/>
        </el-form-item>
      </el-col>
    </el-row>
    <div class="dialog-section-title" style="margin-top:8px">采购信息</div>
    <el-row :gutter="16">
      <el-col :span="12"><el-form-item label="入库时间"><el-date-picker v-model="assetDialog.form.purchase_date" type="date" value-format="YYYY-MM-DD" style="width:100%"/></el-form-item></el-col>
      <el-col :span="12"><el-form-item label="保修到期"><el-date-picker v-model="assetDialog.form.warranty_expire" type="date" value-format="YYYY-MM-DD" style="width:100%"/></el-form-item></el-col>
      <el-col :span="12"><el-form-item label="采购价格(¥)"><el-input-number v-model="assetDialog.form.purchase_price" :precision="2" :min="0" style="width:100%"/></el-form-item></el-col>
      <el-col :span="12">
        <el-form-item label="关联订单">
          <el-select
            v-model="assetDialog.form.order_id"
            filterable remote clearable
            :remote-method="searchOrders"
            :loading="orderSearchLoading"
            placeholder="搜索订单号/标题"
            style="width:100%"
            @change="onAssetOrderChange"
          >
            <el-option v-for="o in orderOptions" :key="o.id" :label="o.order_no+' '+o.title" :value="o.id">
              <span>{{ o.order_no }}</span>
              <span style="color:#8c8c8c;font-size:12px;margin-left:8px">{{ o.title }}</span>
            </el-option>
          </el-select>
          <div v-if="assetDialog.form.order_id" style="margin-top:4px;font-size:12px;color:#8c8c8c">
            该订单共可绑定 <b style="color:#333">{{ orderBindTotal }}</b> 个资产，已绑定 <b style="color:#333">{{ orderBindUsed }}</b> 个，
            <span :style="{color: orderBindRemain>0 ? '#52c41a' : '#ff4d4f', fontWeight:'bold'}">剩余 {{ orderBindRemain }} 个</span>
            <span v-if="orderBindRemain===0" style="color:#ff4d4f">（已达上限）</span>
          </div>
        </el-form-item>
      </el-col>
      <el-col :span="12" v-if="assetDialog.form.order_id && currentOrderItems.length">
        <el-form-item label="关联明细">
          <el-select v-model="assetDialog.form.order_item_id" clearable placeholder="选择对应明细行" style="width:100%">
            <el-option
              v-for="item in currentOrderItems"
              :key="item.id"
              :value="item.id"
              :label="item.item_name + (item.model?' ('+item.model+')':'')"
            >
              <span>{{ item.item_name }}</span>
              <el-tag size="small" type="warning" style="margin-left:6px">{{ item.arrived_qty }}/{{ item.quantity }}</el-tag>
            </el-option>
          </el-select>
        </el-form-item>
      </el-col>
    </el-row>
    <el-form-item label="备注/变更记录">
      <el-input v-model="assetDialog.form.notes" type="textarea" :rows="2"/>
    </el-form-item>
    <!-- 实物图上传 -->
    <div class="dialog-section-title" style="margin-top:8px">实物图片（可选）</div>
    <div class="photo-upload-area">
      <div class="photo-upload-label">
        <strong>上传资产实物照片</strong><span>支持 jpg / png / webp，单张限 10MB</span>
      </div>
      <label class="photo-upload-btn">
        📷 选择图片
        <input type="file" accept="image/*" multiple @change="onAssetPhotoSelect">
      </label>
      <div class="photo-preview-list" v-if="assetDialog.pendingPhotos && assetDialog.pendingPhotos.length">
        <div v-for="(p,i) in assetDialog.pendingPhotos" :key="i" class="photo-preview-item">
          <img :src="p.preview" :alt="p.file.name">
          <div class="remove-btn" @click="removeAssetPhoto(i)">✕</div>
        </div>
      </div>
    </div>
  </el-form>
  <template #footer>
    <el-button @click="assetDialog.visible=false">取消</el-button>
    <el-button type="primary" @click="saveAsset" :loading="assetDialog.saving">保存</el-button>
  </template>
</el-dialog>

<!-- ══════════ 资产详情抽屉 ══════════ -->
<el-drawer v-model="detailDrawer.visible" :title="'资产详情 - ' + (detailDrawer.asset?.asset_no||'')" size="480px" destroy-on-close>
  <div v-if="detailDrawer.asset" style="font-size:13px">
    <el-descriptions :column="2" border size="small">
      <el-descriptions-item label="资产编号" :span="2">{{ detailDrawer.asset.asset_no }}</el-descriptions-item>
      <el-descriptions-item label="类目">{{ getAssetTypeName(detailDrawer.asset.category) }}</el-descriptions-item>
      <el-descriptions-item label="状态"><span class="status-tag" :class="detailDrawer.asset.status">{{ detailDrawer.asset.status }}</span></el-descriptions-item>
      <el-descriptions-item label="品牌">{{ detailDrawer.asset.brand }}</el-descriptions-item>
      <el-descriptions-item label="型号">{{ detailDrawer.asset.model }}</el-descriptions-item>
      <el-descriptions-item label="配置信息" :span="2">{{ detailDrawer.asset.spec }}</el-descriptions-item>
      <el-descriptions-item label="S/N">{{ detailDrawer.asset.sn }}</el-descriptions-item>
      <el-descriptions-item label="KEY">{{ detailDrawer.asset.key_info }}</el-descriptions-item>
      <el-descriptions-item label="有线 MAC">{{ detailDrawer.asset.mac_wired }}</el-descriptions-item>
      <el-descriptions-item label="无线 MAC">{{ detailDrawer.asset.mac_wireless }}</el-descriptions-item>
      <el-descriptions-item label="存放地">{{ detailDrawer.asset.location }}</el-descriptions-item>
      <el-descriptions-item label="关联人">{{ detailDrawer.asset.assignee }}</el-descriptions-item>
      <el-descriptions-item label="关联账号" :span="2">{{ detailDrawer.asset.account_name || (detailDrawer.asset.account_pwd ? detailDrawer.asset.account_pwd.split(' / ')[0] : '-') }}</el-descriptions-item>
      <el-descriptions-item label="关联密码" :span="2">{{ detailDrawer.asset.account_password || (detailDrawer.asset.account_pwd ? detailDrawer.asset.account_pwd.split(' / ')[1] : '-') }}</el-descriptions-item>
      <el-descriptions-item label="入库时间">{{ detailDrawer.asset.purchase_date }}</el-descriptions-item>
      <el-descriptions-item label="保修到期">{{ detailDrawer.asset.warranty_expire }}</el-descriptions-item>
      <el-descriptions-item label="采购价格">{{ detailDrawer.asset.purchase_price ? '¥'+detailDrawer.asset.purchase_price : '-' }}</el-descriptions-item>
      <el-descriptions-item label="账面价值">{{ detailDrawer.asset.book_value != null ? '¥'+detailDrawer.asset.book_value : '-' }}</el-descriptions-item>
      <el-descriptions-item label="更新时间">{{ detailDrawer.asset.updated_at?.slice(0,16) }}</el-descriptions-item>
      <el-descriptions-item label="备注/变更" :span="2">{{ detailDrawer.asset.notes }}</el-descriptions-item>
    </el-descriptions>

    <div style="margin-top:20px;font-size:13px;font-weight:600;color:#1a1f35;margin-bottom:10px">操作历史</div>
    <div v-if="detailDrawer.logs.length">
      <div class="log-item" v-for="log in detailDrawer.logs" :key="log.id">
        <div class="log-dot" :class="log.log_type"></div>
        <div class="log-content">
          <div><strong>{{ log.log_type }}</strong>
            <span v-if="log.target_user"> · {{ log.target_user }}</span>
            <span v-if="log.to_location"> → {{ log.to_location }}</span>
          </div>
          <div style="font-size:11px;color:#8c8c8c">{{ log.operator }} · {{ log.remark }}</div>
        </div>
        <div class="log-time">{{ log.log_time?.slice(0,16) }}</div>
      </div>
    </div>
    <div v-else class="empty-state" style="padding:20px"><p>暂无记录</p></div>

    <!-- 实物照片 -->
    <div v-if="detailDrawer.photos && detailDrawer.photos.length" style="margin-top:20px">
      <div style="font-size:13px;font-weight:600;color:#1a1f35;margin-bottom:10px">📷 实物照片（最近操作）</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <el-image
          v-for="photo in detailDrawer.photos" :key="photo.id"
          :src="`${API}/photos/${photo.id}`"
          :preview-src-list="detailDrawer.photos.map(p=>`${API}/photos/${p.id}`)"
          style="width:100px;height:80px;border-radius:6px;object-fit:cover;border:1px solid #f0f0f0"
          fit="cover"
        />
      </div>
    </div>

    <!-- 资产档案照片（编辑时上传） -->
    <div v-if="detailDrawer.assetPhotos && detailDrawer.assetPhotos.length" style="margin-top:20px">
      <div style="font-size:13px;font-weight:600;color:#1a1f35;margin-bottom:10px">📁 资产档案照片</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <el-image
          v-for="photo in detailDrawer.assetPhotos" :key="photo.id"
          :src="`${API}/photos/${photo.id}`"
          :preview-src-list="detailDrawer.assetPhotos.map(p=>`${API}/photos/${p.id}`)"
          style="width:100px;height:80px;border-radius:6px;object-fit:cover;border:1px solid #f0f0f0"
          fit="cover"
        />
      </div>
    </div>

    <!-- 操作按钮区 -->
    <div style="margin-top:24px;padding-top:16px;border-top:1px solid #f0f0f0">
      <div style="font-size:13px;font-weight:600;color:#1a1f35;margin-bottom:12px">快捷操作</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <el-button size="small" type="primary" @click="openAssetForm(detailDrawer.asset);detailDrawer.visible=false">✏️ 编辑</el-button>
        <el-button size="small" type="success"
          v-if="detailDrawer.asset.status==='在库'"
          @click="openStockOut(detailDrawer.asset);detailDrawer.visible=false">📤 出库</el-button>
        <el-button size="small" type="warning"
          v-if="detailDrawer.asset.status==='在用'"
          @click="openReturn(detailDrawer.asset);detailDrawer.visible=false">📥 归还</el-button>
        <el-button size="small" type="info"
          v-if="detailDrawer.asset.status==='在用'"
          @click="openTransfer(detailDrawer.asset);detailDrawer.visible=false">🔄 调拨</el-button>
        <el-button size="small" type="danger"
          v-if="['在库','在用'].includes(detailDrawer.asset.status)"
          @click="openRepairForm(detailDrawer.asset);detailDrawer.visible=false">🔧 报修</el-button>
        <el-button size="small" type="danger" plain
          @click="openDeleteApply(detailDrawer.asset);detailDrawer.visible=false">🗑️ 申请删除</el-button>
      </div>
    </div>
  </div>
</el-drawer>

<!-- ══════════ 耗材详情抽屉 ══════════ -->

  <div v-if="consumableDetailDrawer.item" style="font-size:13px">
    <el-descriptions :column="2" border size="small">
      <el-descriptions-item label="耗材编号" :span="2">{{ consumableDetailDrawer.item.item_no }}</el-descriptions-item>
      <el-descriptions-item label="名称" :span="2">{{ consumableDetailDrawer.item.name }}</el-descriptions-item>
      <el-descriptions-item label="类目">{{ consumableDetailDrawer.item.category }}</el-descriptions-item>
      <el-descriptions-item label="状态">
        <span :style="getConsumableStatusStyle(consumableDetailDrawer.item.status)" style="padding:2px 8px;border-radius:12px;font-size:12px">
          {{ consumableDetailDrawer.item.status }}

<script src="auth.js"></script>
<script>
const { createApp, ref, reactive, computed, onMounted, nextTick, watch } = Vue;
const API = '/api';

createApp({
  setup() {
    const _bootRole = (window.__auth_user__ && window.__auth_user__.role) || '';
    const page = ref(
      (window.amsIsAdmin && window.amsIsAdmin(_bootRole))
        ? window.amsDefaultAdminPage(_bootRole)
        : 'dashboard'
    );
    let _roleLandingApplied = false;
    const pageTitle = computed(() => ({
      dashboard: '仪表盘', assets: '资产台账', stock: '出入库记录',
      repair: '维修管理', dispose: '资产处理记录', employees: '用户管理',
      lark: '飞书通知配置', settings: '系统设置',
      consumables: '耗材台账', consumable_logs: '耗材领用记录',
      stock_op: '出入库操作', repair_op: '资产报修', dispose_op: '资产处理',
      orders: '采购订单', fields: '字段维护',
      approval: '审批中心', inventory: '资产盘点',
    }[page.value] || ''));

    // ═══════════════════════════════════════════════════════════════
    // 登录认证 & 环境检测
    // ═══════════════════════════════════════════════════════════════
    const isLoggedIn = ref(!!window.__auth_passed__);
    const authLoading = ref(!window.__auth_passed__);
    const authError = ref('');
    
    // Lark JSBridge 检测与初始化
    
    // 检测是否在 Lark 环境
    function checkLarkEnvironment() {
      const ua = navigator.userAgent.toLowerCase();
      return ua.includes('lark') || ua.includes('feishu');
    }

    // 用户信息
    const currentUser = reactive(window.__auth_user__ || {
      id: null, name: '', role: '', avatar: '', source: 'local',
      larkUserId: null, larkOpenId: null, department: '', email: ''
    });
    
    const currentUserRole = computed(() => currentUser.role || '访客');
    const canImport = computed(() => ['超管', '管理员', '普通管理员'].includes(currentUserRole.value));
    const isSuperAdmin = computed(() => currentUser.role === '超管');
    const isAdminRole = computed(() => ['超管', '管理员', '普通管理员'].includes(currentUserRole.value));
    // 非管理角色一律视为普通用户（role 可能是 '普通用户' / 'user' / '' 等历史取值）
    const isRegularUser = computed(() => !window.amsIsAdmin(currentUser.role));

    // 普通用户应使用用户门户(/my.html)，不应停留在管理后台
    function ensureUserPortalRouting() {
      // 角色未就绪时不跳（避免把还没拿到角色的管理角色误踢走）
      if (!currentUser.role) return;
      window.amsRejectIfNotAdmin(currentUser.role);
    }

    function canSeeMenu(key) {
      return window.amsCanSeeMenu(currentUser.role, key);
    }

    function _goRolePage(dest) {
      page.value = dest;
      if (dest === 'approval') {
        try { loadApprovals(); loadFulfillable(); } catch (e) {}
      } else if (dest === 'assets') {
        try { loadAssets(); } catch (e) {}
      }
    }

    // 首次按角色落到默认子页；之后若当前页被藏掉则回落
    function applyRoleView() {
      if (!currentUser.role || !window.amsIsAdmin(currentUser.role)) return;
      const dest = window.amsDefaultAdminPage(currentUser.role);
      if (!_roleLandingApplied) {
        _roleLandingApplied = true;
        if (page.value !== dest) _goRolePage(dest);
        else if (dest === 'approval') {
          try { loadApprovals(); loadFulfillable(); } catch (e) {}
        }
        return;
      }
      if (!window.amsCanSeeAdminPage(currentUser.role, page.value)) {
        _goRolePage(dest);
      }
    }

    watch(page, (p) => {
      if (!currentUser.role || !window.amsIsAdmin(currentUser.role)) return;
      if (!window.amsCanSeeAdminPage(currentUser.role, p)) {
        _goRolePage(window.amsDefaultAdminPage(currentUser.role));
      }
    });

    // 监听 auth.js 完成事件（Lark 环境使用）
    document.addEventListener('ams-auth-ready', function() {
      isLoggedIn.value = true;
      authLoading.value = false;
      if (window.__auth_user__) {
        Object.assign(currentUser, window.__auth_user__);
        // 同步刷新用户缓存，覆盖历史 role 脏值，避免同步守卫误判成循环
        try { localStorage.setItem('ams_user', JSON.stringify(window.__auth_user__)); } catch (e) {}
      }
      ensureUserPortalRouting();
      applyRoleView();
    });

    // ══════════ 独立认证逻辑（不依赖 auth.js）══════════
    // 检测环境
    const isLocalEnv = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.startsWith('192.168.');
    const inLarkEnv = (function() {
      const ua = navigator.userAgent.toLowerCase();
      return ua.includes('lark') || ua.includes('feishu');
    })();

    // 本地环境 / 非 Lark 环境：直接验证 token
    if (isLocalEnv || !inLarkEnv) {
      (async function directAuth() {
        const token = localStorage.getItem('ams_token');
        if (!token) {
          window.location.href = '/login.html';
          return;
        }
        try {
          const res = await fetch(API + '/auth/check', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (data.success && data.is_logged_in) {
            // token 有效，进入系统
            isLoggedIn.value = true;
            authLoading.value = false;
            if (data.user) Object.assign(currentUser, data.user);
            ensureUserPortalRouting();
            applyRoleView();
          } else {
            // token 无效，清除并跳转登录页
            localStorage.removeItem('ams_token');
            localStorage.removeItem('ams_user');
            window.location.href = '/login.html';
          }
        } catch (e) {
          // 网络错误，清除并跳转登录页
          localStorage.removeItem('ams_token');
          localStorage.removeItem('ams_user');
          window.location.href = '/login.html';
        }
      })();
    } else {
      // Lark 环境：确保 authLoading 不会永久为 true
      // 如果 auth.js 没有触发 ams-auth-ready 事件，5秒后超时跳转登录页
      setTimeout(function() {
        if (authLoading.value && !isLoggedIn.value) {
          window.location.href = '/login.html';
        }
      }, 5000);
    }

    // 用户下拉菜单操作
    function showUserProfile() {
      window.open('/profile.html', '_blank');
    }

    function showSettings() {
      page.value = 'settings';
    }

    function switchToUserView() {
      localStorage.setItem('ams_active_role', 'user');
      window.location.href = '/my.html';
    }

    async function handleLogout() {

    function onAssetPhotoSelect(e) {
      const MAX = 10 * 1024 * 1024; // 10MB
      const OK_EXT = ['jpg','jpeg','png','gif','webp','heic','bmp'];
      const files = Array.from(e.target.files || []);
      files.forEach(f => {
        const ext = (f.name.split('.').pop() || '').toLowerCase();
        if (!f.type.startsWith('image/') && !OK_EXT.includes(ext)) {
          ElementPlus.ElMessage.error(`「${f.name}」不是图片文件，已跳过`); return;
        }
        if (f.size > MAX) {
          ElementPlus.ElMessage.error(`「${f.name}」超过 10MB 限制，已跳过`); return;
        }
        const reader = new FileReader();
        reader.onload = ev => assetDialog.pendingPhotos.push({ file: f, preview: ev.target.result });
        reader.readAsDataURL(f);
      });
      e.target.value = '';
    }

    async function saveAsset() {
      assetDialog.saving = true;
      const form = assetDialog.form;
      // 未勾选关联账号密码时，清空账号/密码，避免误存
      if (!form.account_enabled) {
        form.account_name = '';
        form.account_password = '';
      }
      const url  = assetDialog.isEdit ? `${API}/assets/${form.id}` : `${API}/assets`;
      const meth = assetDialog.isEdit ? 'PUT' : 'POST';
      const r = await fetch(url, { method:meth, headers:{'Content-Type':'application/json'}, body:JSON.stringify(form) });
      const data = await r.json();
      assetDialog.saving = false;
      if (!r.ok) { ElementPlus.ElMessage.error(data.error||'操作失败'); return; }
      // 上传实物图
      const assetId = data.id || form.id;
      if (assetId && assetDialog.pendingPhotos.length > 0) {
        await uploadPhotosToAsset(assetId, assetDialog.pendingPhotos);
      }

      assetDialog.visible = false;
      loadAssets(); loadStats();

        employeeSearch.expanded[uid] = {

    // ── 同意并处理：先审批通过，再自动打开对应操作弹窗 ──
    async function approveAndProcess(row) {
      try {
        // 1. 先执行审批通过
        const r = await fetch(API + '/approvals/' + row.id + '/approve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('ams_token') },
          body: JSON.stringify({
            status: '已通过',
            approver: currentUser.value?.name || '',
            apply_type: row.apply_type
          })
        });
        const d = await r.json();
        if (!d.success) {
          ElementPlus.ElMessage.error(d.error || '审批失败');
          return;
        }
        ElementPlus.ElMessage.success('已批准，正在打开操作界面...');
        loadApprovals();

        // 2. 根据申请类型打开对应操作弹窗
        const info = row.info ? (typeof row.info === 'string' ? JSON.parse(row.info) : row.info) : {};
        const assetNo = row.asset_no || row.asset_info || info.asset_no || '';

        // 延迟一点让用户看到"已批准"提示
        setTimeout(() => {
          if (row.apply_type === '资产出库' || row.apply_type === '借用出库') {
            // 打开出库/借出弹窗
            if (assetNo) {
              const asset = assets.value.find(a => a.asset_no === assetNo);
              if (asset) {
                if (row.apply_type === '借用出库') openBorrowOut(asset);
                else openStockOut(asset);
              } else {
                ElementPlus.ElMessage.warning('未找到对应资产，请手动操作');
              }
            } else {
              ElementPlus.ElMessage.warning('该申请无关联资产编号，请手动在资产台账中操作');
            }
          } else if (row.apply_type === '资产回收' || row.apply_type === '借用归还') {
            // 打开归还弹窗
            if (assetNo) {
              const asset = assets.value.find(a => a.asset_no === assetNo);
              if (asset) {
                if (row.apply_type === '借用归还') openBorrowReturn(asset);
                else openReturn(asset);
              } else {
                ElementPlus.ElMessage.warning('未找到对应资产，请手动操作');
              }
            } else {
              ElementPlus.ElMessage.warning('该申请无关联资产编号，请手动操作');
            }
          } else if (row.apply_type === '资产调拨') {
            if (assetNo) {
              const asset = assets.value.find(a => a.asset_no === assetNo);
              if (asset) openTransfer(asset);
              else ElementPlus.ElMessage.warning('未找到对应资产');
            }
          }
        }, 600);
      } catch (e) {
        ElementPlus.ElMessage.error('操作未完成，请稍后重试');
      }
    }

    function viewApprovalDetail(row){
      const info = row.info || {};
      const APP_TYPE_ZH = {
        new_asset:'新资产申请', borrow:'借用申请', return:'归还申请', repair:'报修申请',
        consumable:'耗材领用', replace:'更换设备申请', special:'特殊需求申请'
      };
      const DETAIL_LABELS = {
        category:'类目', model:'型号/配置', reason:'原因说明', name:'耗材名称', qty:'数量', quantity:'数量',
        item_id:'耗材ID', asset_id:'资产ID', borrow_return_date:'预计归还日', fault_desc:'故障描述', note:'备注'
      };
      const APP_FIELD_LABELS = {
        app_no:'申请单号', app_type:'申请类型', app_type_zh:'申请类型', applicant_name:'申请人',
        title:'标题', reason:'申请原因', asset_no:'资产编号', apply_time:'申请时间', created_at:'创建时间',
        status:'状态', review_comment:'审批意见', reviewer_name:'审批人', review_time:'审批时间',
        fulfilled:'是否已发放'
      };
      const OP_PAYLOAD_LABELS = {
        target_user:'目标人员', to_location:'目标位置', operator:'经办人', remark:'备注',
        to_subject:'目标主体', to_region:'目标区域', fault_desc:'故障描述', repair_vendor:'维修厂商',
        submit_by:'提交人', repair_notes:'维修备注', dispose_type:'处置方式', reason:'处置原因',
        approved_by:'批准人', dispose_date:'处置日期', notes:'备注', user_name:'使用人', dept:'部门',
        use_date:'使用日期', return_date:'归还日期'
      };
      const SKIP_APP_KEYS = new Set([
        'id','applicant_id','reviewer_id','asset_id','po_id','close_time','detail','app_type'
      ]);
      const STATUS_ZH = { pending:'待审批', approved:'已通过', rejected:'已驳回', processing:'审核中' };

      function fmtVal(v){
        if(v === null || v === undefined || v === '') return '';
        if(typeof v === 'boolean') return v ? '是' : '否';
        if(typeof v === 'object') return JSON.stringify(v);
        return String(v);
      }
      function addLine(label, value){
        const t = fmtVal(value);
        if(!t) return '';
        return `<p><b>${esc(label)}：</b>${esc(t)}</p>`;
      }

      let html = '<div style="min-width:360px;line-height:1.8;">';

      if(row.apply_type === '采购入库'){
        html += addLine('订单号', info.order_no || '-');
        const ids = Array.isArray(info.asset_ids) ? info.asset_ids : (info.asset_ids ? [info.asset_ids] : []);
        if(ids.length){
          html += '<p><b>待入库资产ID：</b></p><ul style="margin:4px 0 0 18px;padding:0;">';
          ids.forEach(id => { html += `<li>${esc(String(id))}</li>`; });
          html += '</ul>';
        }
        if(info.asset_nos && info.asset_nos.length){
          html += '<p><b>资产编号：</b></p><ul style="margin:4px 0 0 18px;padding:0;">';
          info.asset_nos.forEach(no => { html += `<li>${esc(no)}</li>`; });
          html += '</ul>';
        }
      } else if(row.apply_type === '资产删除'){
        const tt = info.target_type === 'asset' ? '固定资产' : (info.target_type === 'consumable' ? '耗材' : info.target_type);
        html += addLine('删除对象', tt);
        html += addLine('编号', info.target_no);
        html += addLine('删除原因', info.reason);
      } else if(row.apply_type === '资产申请'){
        html += addLine('申请单号', info.app_no);
        html += addLine('申请类型', info.app_type_zh || APP_TYPE_ZH[info.app_type] || info.app_type);
        html += addLine('申请人', info.applicant_name);
        html += addLine('标题', info.title);
        html += addLine('申请原因', info.reason);
        html += addLine('资产编号', info.asset_no);
        html += addLine('状态', STATUS_ZH[info.status] || info.status);
        html += addLine('审批人', info.reviewer_name);
        html += addLine('审批意见', info.review_comment);
        html += addLine('审批时间', info.review_time);
        if(info.fulfilled === 1 || info.fulfilled === true) html += addLine('是否已发放', '已发放');
        else if(info.fulfilled === 0 || info.fulfilled === false) html += addLine('是否已发放', '未发放');
        let detail = info.detail;
        if(typeof detail === 'string'){
          try { detail = JSON.parse(detail || '{}'); } catch(e){ detail = {}; }
        }
        if(detail && typeof detail === 'object' && Object.keys(detail).length){
          html += '<p style="margin:8px 0 4px;color:#606266;"><b>申请明细</b></p>';
          for(const [k,v] of Object.entries(detail)){
            if(v === '' || v === null || v === undefined) continue;
            html += addLine(DETAIL_LABELS[k] || APP_FIELD_LABELS[k] || k, v);
          }
        }
      } else {
        // 操作类：出库/回收/调拨/转移/维修/处置/借用等
        const nos = Array.isArray(info.asset_nos) ? info.asset_nos : [];
        if(nos.length) html += addLine('资产编号', nos.join('、'));
        const p = info.payload || {};
        for(const [k,v] of Object.entries(p)){
          if(v === '' || v === null || v === undefined) continue;
          if(k === 'proof_photos' || Array.isArray(v) || (typeof v === 'object')) continue;
          html += addLine(OP_PAYLOAD_LABELS[k] || k, v);
        }
        const photos = Array.isArray(p.proof_photos) ? p.proof_photos
          : (Array.isArray(info.proof_photos) ? info.proof_photos : []);
        if(photos.length){
          html += '<p><b>证明附件：</b></p><ul style="margin:4px 0 0 18px;padding:0;">';
          photos.forEach(ph => {
            const url = ph.url || ('/api/uploads/' + (ph.file_path ? ph.file_path.split('/').pop() : (ph.file_name || '')));
            const name = ph.file_name || ph.id || '-';
            html += `<li><a href="${esc(url)}" target="_blank">${esc(String(name))}</a></li>`;
          });
          html += '</ul>';
        }
        // 若以上都无内容，再降级展示已知中文字段
        if(html.indexOf('<p><b>') < 0){
          for(const [k,v] of Object.entries(info)){
            if(SKIP_APP_KEYS.has(k) || v === '' || v === null || typeof v === 'object') continue;
            html += addLine(APP_FIELD_LABELS[k] || OP_PAYLOAD_LABELS[k] || k, v);
          }
        }
      }

      html += `<hr style="margin:10px 0;border:none;border-top:1px #ebeef5 solid;">`;
      html += `<p style="color:#909399;font-size:12px;margin:0;">申请人：${esc(row.applicant || row.apply_by || '-')} &nbsp;|&nbsp; 状态：<b style="color:${row.status==='已通过'?'#67c23a':row.status==='已驳回'?'#f56c6c':'#e6a23c'}">${esc(row.status)}</b> &nbsp;|&nbsp; 申请时间：${esc(row.apply_time || row.created_at || '-')}</p>`;
      html += '</div>';

      ElementPlus.ElMessageBox.alert(html, '审批详情 - ' + row.apply_type, {
        dangerouslyUseHTMLString: true,
        customClass: 'approval-detail-box'
      });
    }

    /** HTML 转义防 XSS */
    function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

    // ══════════ 资产盘点 ══════════
    const inventoryList = ref([]), inventoryLoading = ref(false);
    const inventoryCreateDialog = reactive({
      visible: false,
      loading: false,
      form: { task_name: '', scope_type: 'in_stock', scope_value: '', notes: '' }
    });
    const inventoryWorkbench = reactive({
      visible: false,
      task: null,
      items: [],
      filter: '',
      loading: false,
      checkingId: null,
      completing: false,
    });

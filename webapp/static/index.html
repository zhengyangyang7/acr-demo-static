<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新嘉理财师 · 周度数据自动更新</title>
  <style>
    :root { --blue: #2c5fa8; --bg: #f5f5f5; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: #222; }
    header { background: var(--blue); color: #fff; padding: 16px 24px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 6px 0 0; font-size: 13px; color: #c8d8f0; }
    main { max-width: 860px; margin: 0 auto; padding: 20px; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; }
    label { display: block; font-weight: 700; margin-bottom: 6px; }
    .hint { color: #888; font-size: 12px; margin: 0 0 8px; }
    input[type=file] { width: 100%; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    button { background: var(--blue); color: #fff; border: 0; border-radius: 6px; padding: 10px 22px; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.secondary { background: #1a7a4a; }
    .sep { display: flex; align-items: center; gap: 10px; color: #888; font-size: 13px; margin: 22px 0 14px; }
    .sep:before, .sep:after { content: ""; flex: 1; height: 1px; background: #ccc; }
    #status { font-size: 13px; color: #555; }
    #log { background: #1e1e1e; color: #d4d4d4; font-family: Consolas, "Courier New", monospace; font-size: 13px; height: 320px; overflow: auto; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
    .ok { color: #1a7a4a; }
    .err { color: #b42318; }
  </style>
</head>
<body>
  <header>
    <h1>新嘉理财师 · 周度数据自动更新</h1>
    <p>上传源文件与上一周分层表 → 浏览器里完成周度更新 → 下载产出文件</p>
  </header>
  <main>
    <div class="card">
      <label>源文件（汇总表&amp;明细，可多选）</label>
      <p class="hint">文件名需含 截止YYYYMMDD，例：新嘉理财师考核数据_截止20260918-汇总表&amp;明细.xlsx</p>
      <input id="sources" type="file" accept=".xlsx,.xls" multiple />
    </div>
    <div class="card">
      <label>目标文件（上一周累积分层表）</label>
      <p class="hint">工具会另存产出文件，不会覆盖你上传的这份</p>
      <input id="target" type="file" accept=".xlsx,.xls" />
    </div>
    <div class="card">
      <label><input id="keep" type="checkbox" checked /> 保留其他团队（无团队长的理财师）</label>
    </div>
    <div class="row">
      <button id="run" type="button">开始更新</button>
      <a id="dl" href="/api/jobs/current/download" style="display:none"><button id="dlbtn" class="secondary" type="button">下载产出文件</button></a>
      <span id="status">就绪</span>
    </div>
    <div class="sep">考核数据拆分</div>
    <div class="card">
      <label>汇总表&amp;明细（拆分源文件）</label>
      <p class="hint">按理财师拆分，每人生成一个独立 Excel，打包成 zip 下载</p>
      <input id="splitSource" type="file" accept=".xlsx,.xls" />
    </div>
    <div class="row">
      <button id="split" class="secondary" type="button">开始拆分</button>
    </div>
    <div class="card">
      <label>执行日志</label>
      <div id="log"></div>
    </div>
  </main>
  <script>
    const logBox = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const runBtn = document.getElementById("run");
    const splitBtn = document.getElementById("split");
    const dl = document.getElementById("dl");
    const dlBtn = document.getElementById("dlbtn");
    let timer = null;

    function setBusy(busy) {
      runBtn.disabled = busy;
      splitBtn.disabled = busy;
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || "";
    }

    function render(body) {
      logBox.textContent = (body.logs || []).join("\n");
      logBox.scrollTop = logBox.scrollHeight;
      dlBtn.textContent = body.kind === "split" ? "下载拆分结果" : "下载产出文件";
      if (body.status === "running") {
        setStatus("处理中…");
        setBusy(true);
        dl.style.display = "none";
      } else if (body.status === "success") {
        setStatus(body.kind === "split" ? "拆分完成，可以下载 zip" : "完成，可以下载产出文件", "ok");
        setBusy(false);
        dl.style.display = body.has_output ? "inline" : "none";
      } else if (body.status === "error") {
        setStatus(body.error || "失败", "err");
        setBusy(false);
        dl.style.display = "none";
      }
    }

    async function poll() {
      const r = await fetch("/api/jobs/current");
      const body = await r.json();
      render(body);
      if (body.status === "success" || body.status === "error") {
        clearInterval(timer);
        timer = null;
      }
    }

    function startPoll() {
      if (timer) clearInterval(timer);
      timer = setInterval(poll, 400);
      poll();
    }

    document.getElementById("run").onclick = async () => {
      const sources = document.getElementById("sources").files;
      const target = document.getElementById("target").files[0];
      if (!sources.length || !target) {
        setStatus("请先选择源文件和目标文件", "err");
        return;
      }
      const fd = new FormData();
      for (const f of sources) fd.append("sources", f);
      fd.append("target", target);
      fd.append("keep_other_team", document.getElementById("keep").checked ? "true" : "false");
      setBusy(true);
      dl.style.display = "none";
      logBox.textContent = "";
      setStatus("已提交，开始处理…");
      const r = await fetch("/api/jobs", { method: "POST", body: fd });
      const body = await r.json();
      if (!r.ok) {
        setStatus(body.error || "无法开始", "err");
        setBusy(false);
        return;
      }
      startPoll();
    };

    document.getElementById("split").onclick = async () => {
      const source = document.getElementById("splitSource").files[0];
      if (!source) {
        setStatus("请先选择要拆分的汇总表&明细", "err");
        return;
      }
      const fd = new FormData();
      fd.append("source", source);
      setBusy(true);
      dl.style.display = "none";
      logBox.textContent = "";
      setStatus("已提交，开始拆分…");
      const r = await fetch("/api/split", { method: "POST", body: fd });
      const body = await r.json();
      if (!r.ok) {
        setStatus(body.error || "无法开始", "err");
        setBusy(false);
        return;
      }
      startPoll();
    };
  </script>
</body>
</html>
